name: desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      IMAGE: oxzk/desktop:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./desktop
          file: ./desktop/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desktop-${{ matrix.arch }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          mkdir -p .image-digests
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > .image-digests/${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: desktop-digest-${{ matrix.arch }}
          path: .image-digests/*.txt
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-digest-*
          path: .image-digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both architectures
        run: |
          mapfile -t images < <(cat .image-digests/amd64.txt .image-digests/arm64.txt)
          test "${#images[@]}" -eq 2
          docker buildx imagetools create \
            --tag "oxzk/desktop:$RELEASE_TAG" \
            --tag oxzk/desktop:latest "${images[@]}"
