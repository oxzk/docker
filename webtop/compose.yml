services:
  webtop:
    build:
      context: .
    container_name: webtop
    hostname: webtop
    shm_size: 2gb
    ports:
      - "127.0.0.1:8444:8444"
    environment:
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
      WARPSCOUT_COUNTRY: ${WARPSCOUT_COUNTRY:-US}
      PASSWORD: ${PASSWORD:-}
    volumes:
      - workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  workspace:
