services:
  desktop:
    container_name: desktop
    image: oxzk/desktop:latest
    hostname: vm
    shm_size: 2gb
    ports:
      - "127.0.0.1:8444:8444"
    env_file:
      - .env
    volumes:
      - ./data/desktop:/home/admin
      - ./data/warp:/var/lib/cloudflare-warp
    restart: unless-stopped
    stop_grace_period: 30s
